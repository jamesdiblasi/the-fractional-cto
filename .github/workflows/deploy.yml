name: Deploy to Azure App Service

# Builds the standalone Next.js server and deploys it to the App Service web
# app `the-fractional-cto` (resource group leadgen, plan leadnet-plan).
#
# Authentication is the OIDC federated credential that Azure's Deployment
# Center created when the repository was connected: the three
# AZUREAPPSERVICE_* repository secrets below are its client, tenant and
# subscription IDs, not passwords. `id-token: write` lets the job request the
# token. Deployment Center's own generated workflow was replaced by this one
# because it deployed the raw repository, and the app's startup command
# (`node server.js`) expects the standalone output instead.
#
# Runtime settings (SITE_URL, BOOKING_URL, MAILJET_*, the TIER_* switches)
# live in the web app's application settings, see .env.example. The analytics
# IDs are build-time and come from repository variables.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2348BC9EBC3F4B3C913A91962CC8E912 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7200B959B7E24E2480597986E4B6B87C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_570CC1063AA04D74A0E0FD5C27AA97F8 }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: the-fractional-cto
          slot-name: Production
          # `output: 'standalone'` emits a self-contained server. The build
          # script copies .next/static and public/ in alongside it, so this
          # folder is the whole deployable app.
          package: .next/standalone

      - name: Smoke check
        # A deploy that lands but does not serve is a failure, not a success.
        # App Service restarts the container after a deploy, so allow a couple
        # of minutes of 503 before calling it.
        run: |
          url="https://the-fractional-cto.azurewebsites.net/"
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            echo "attempt $i: $code"
            if [ "$code" = "200" ]; then
              curl -s "$url" | grep -q "The Fractional CTO" && exit 0
            fi
            sleep 5
          done
          echo "::error::$url did not return 200 with the site body within two minutes."
          exit 1
